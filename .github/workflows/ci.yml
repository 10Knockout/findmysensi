name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Public Codebase
    runs-on: ubuntu-latest
    env:
      # next.config.mjs refuses to build or serve without an HTTPS API origin,
      # so no deployment can silently proxy to localhost. CI only verifies that
      # the app compiles, so it declares a placeholder origin that is never
      # resolved: `.invalid` is reserved by RFC 2606 and cannot be registered.
      API_URL: https://api.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Property Tests
        run: npm test

      - name: Production Build
        run: npm run build

  e2e:
    name: Chromium Browser E2E
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Set at job level, not on the build step: Playwright's webServer runs
      # `next start`, which loads next.config.mjs again and applies the same
      # guard. The smoke specs stub every /api/* route, so the browser never
      # resolves this origin.
      API_URL: https://api.invalid
      # Compiles the ?inputDebug=1 verification overlay into this production
      # bundle so the smoke run can read real movement counters. Deployments
      # leave this unset, which strips the overlay from the shipped bundle.
      NEXT_PUBLIC_ENABLE_INPUT_DIAGNOSTICS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright test harness
        run: npm install --prefix tests/e2e --ignore-scripts --no-package-lock

      - name: Build production web app
        run: npm run build

      - name: Install Chromium
        run: npm run browsers:install --prefix tests/e2e

      - name: Run real-browser smoke tests
        run: npm test --prefix tests/e2e
