name: Format E2E Once

on:
  push:
    branches: [test/playwright-e2e]
    paths:
      - ".github/workflows/format-e2e-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format E2E spec
        run: npx prettier --write tests/e2e/specs/public-smoke.e2e.ts

      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/specs/public-smoke.e2e.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(e2e): apply Prettier"
          git push

# one-shot trigger
