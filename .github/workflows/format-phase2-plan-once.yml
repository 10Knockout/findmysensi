name: Format Phase 2 Plan Once

on:
  push:
    branches: [chore/format-phase2-plan]
    paths:
      - ".github/workflows/format-phase2-plan-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 2 plan
        run: npx prettier --write docs/superpowers/plans/2026-08-31-phase2-gridshot-stabilization.md

      - name: Commit formatted plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-31-phase2-gridshot-stabilization.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(docs): format Phase 2 Gridshot plan"
          git push
