name: Format Phase 1 Branch

on:
  push:
    branches:
      - feat/phase1-product-shell

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/phase1-product-shell

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ecb3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format phase 1 branch"
          git push origin HEAD:feat/phase1-product-shell
