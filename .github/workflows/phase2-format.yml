name: Phase 2 Format

on:
  push:
    branches: [feat/phase2-gridshot-stabilization]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format Phase 2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/phase2-gridshot-stabilization

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npx prettier --write .

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format Phase 2"
          git push origin HEAD:feat/phase2-gridshot-stabilization
